<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор услуг флориста</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="calc-container">
        <h1>Калькулятор услуг</h1>

        <form id="calc-form">
            <div class="form-group">
                <label for="quantity">Количество:</label>
                <input type="number" id="quantity" value="1" min="1" max="200">
            </div>

            <fieldset class="form-group">
                <legend>Выберите тип услуги:</legend>
                <label>
                    <input type="radio" name="serviceType" value="1" checked>
                    Обычный цветок (150 руб./шт)
                </label>
                <label>
                    <input type="radio" name="serviceType" value="2">
                    Букет с оформлением (200 руб./шт)
                </label>
                <label>
                    <input type="radio" name="serviceType" value="3">
                    Цветок в горшке (300 руб./шт)
                </label>
            </fieldset>

            <div class="form-group" id="options-block">
                <label for="extra-option">Выберите оформление:</label>
                <select id="extra-option">
                    <option value="0">Без ленты (+0 руб.)</option>
                    <option value="50">Атласная лента (+50 руб.)</option>
                    <option value="100">Кружевная упаковка (+100 руб.)</option>
                </select>
            </div>

            <div class="form-group" id="property-block">
                <label>
                    <input type="checkbox" id="extra-property" value="150">
                    Добавить керамический горшок (+150 руб.)
                </label>
            </div>

            <div id="result" class="result-box">
                Итого: 0 руб.
            </div>
        </form>
    </div>

</body>
</html>
